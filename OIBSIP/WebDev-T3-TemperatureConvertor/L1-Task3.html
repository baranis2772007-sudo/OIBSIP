<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="L1-Task3.css" />
  </head>
  <body>
    <div class="container">
      <h1>🌡 Temperature Converter</h1>

      <label>Enter Temperature</label>
      <input type="text" id="temperature" placeholder="Enter value" />

      <label>Select Input Unit</label>
      <select id="unit">
        <option value="celsius">Celsius (°C)</option>
        <option value="fahrenheit">Fahrenheit (°F)</option>
        <option value="kelvin">Kelvin (K)</option>
      </select>

      <button onclick="convertTemperature()">Convert</button>

      <p id="error" class="error"></p>

      <div id="result" class="result">
        <h3>Converted Values</h3>

        <p><strong>Celsius:</strong> <span id="celsius">--</span></p>

        <p><strong>Fahrenheit:</strong> <span id="fahrenheit">--</span></p>

        <p><strong>Kelvin:</strong> <span id="kelvin">--</span></p>
      </div>
    </div>

    <script src="L1-Task3.js"></script>
  </body>
</html>
